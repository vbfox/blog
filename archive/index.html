---
layout: "default.html"
---

<div class="posts-page">
  <h2>Archive</h2>
  <ul class="post-list">
    {% for post in collections.posts.pages %}
      <li class="post">
          <a class="post-title post-link" href="{{ post.permalink | prepend: site.base_url }}">{{ post.title }}</a>
          <span class="post-meta">{{ post.published_date | date: "%b %-d, %Y" }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
